<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600"
     role="img" aria-label="Learning curve for severe prompt classification. Four observed training sizes show increasing average precision. Points show the mean across five random subsamples, error bars show one standard deviation, and the dashed line beyond 400 severe examples is an extrapolation.">
  <g font-family="Source Sans Pro, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- axes -->
    <line x1="130" y1="520" x2="900" y2="520" stroke="#1d1d1b" stroke-width="2"/>
    <line x1="130" y1="520" x2="130" y2="60" stroke="#1d1d1b" stroke-width="2"/>
    <g font-size="15" fill="#4a4a4a" text-anchor="middle">
      <text x="174" y="546">50</text>
      <text x="310" y="546">100</text>
      <text x="447" y="546">200</text>
      <text x="583" y="546">400</text>
      <text x="720" y="546">800</text>
      <text x="856" y="546">1600</text>
    </g>
    <g font-size="15" fill="#4a4a4a" text-anchor="end">
      <text x="118" y="487">0.30</text>
      <text x="118" y="410">0.40</text>
      <text x="118" y="333">0.50</text>
      <text x="118" y="257">0.60</text>
      <text x="118" y="180">0.70</text>
      <text x="118" y="103">0.80</text>
    </g>
    <text x="515" y="578" font-size="17" fill="#1d1d1b" text-anchor="middle" font-weight="600">severe training examples (log scale)</text>
    <text x="42" y="290" font-size="17" fill="#1d1d1b" text-anchor="middle" font-weight="600" transform="rotate(-90 42 290)">average precision, severe union</text>

    <!-- log-linear fit within and beyond the observed range -->
    <line x1="130" y1="479" x2="583" y2="245" stroke="#0014a0" stroke-width="3"/>
    <line x1="583" y1="245" x2="900" y2="80" stroke="#0014a0" stroke-width="3" stroke-dasharray="9 6" opacity="0.70"/>

    <!-- measured points; error bars show one standard deviation over five draws -->
    <g stroke="#eb0041" stroke-width="2">
      <line x1="174" y1="406" x2="174" y2="498"/>
      <line x1="310" y1="376" x2="310" y2="426"/>
      <line x1="447" y1="261" x2="447" y2="339"/>
      <line x1="583" y1="224" x2="583" y2="278"/>
    </g>
    <g fill="#eb0041" stroke="#ffffff" stroke-width="2">
      <circle cx="174" cy="452" r="9"/>
      <circle cx="310" cy="401" r="9"/>
      <circle cx="447" cy="300" r="9"/>
      <circle cx="583" cy="251" r="9"/>
    </g>
  </g>
</svg>
