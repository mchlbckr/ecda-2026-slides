<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600"
     role="img" aria-label="Learning curve: average precision rises approximately linearly with the logarithm of the number of severe training examples, from 0.34 at 50 examples to 0.60 at 400. The fit has R squared 0.979. Label counts beyond 400 are extrapolations for planning.">
  <g font-family="Source Sans Pro, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- guides -->
    <line x1="130" y1="175"   x2="719" y2="175"   stroke="#00965a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="130" y1="136.7" x2="793" y2="136.7" stroke="#00965a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="130" y1="98.3"  x2="867" y2="98.3"  stroke="#00965a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="719" y1="175"   x2="719" y2="520"   stroke="#00965a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="793" y1="136.7" x2="793" y2="520"   stroke="#00965a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="867" y1="98.3"  x2="867" y2="520"   stroke="#00965a" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- axes -->
    <line x1="130" y1="520" x2="920" y2="520" stroke="#1d1d1b" stroke-width="2"/>
    <line x1="130" y1="520" x2="130" y2="60"  stroke="#1d1d1b" stroke-width="2"/>
    <g font-size="15" fill="#4a4a4a" text-anchor="middle">
      <text x="174" y="546">50</text><text x="310" y="546">100</text><text x="447" y="546">200</text>
      <text x="583" y="546">400</text><text x="720" y="546">800</text><text x="856" y="546">1600</text>
    </g>
    <g font-size="15" fill="#4a4a4a" text-anchor="end">
      <text x="118" y="487">0.30</text><text x="118" y="410">0.40</text><text x="118" y="333">0.50</text>
      <text x="118" y="257">0.60</text><text x="118" y="180">0.70</text><text x="118" y="103">0.80</text>
    </g>
    <text x="525" y="578" font-size="17" fill="#1d1d1b" text-anchor="middle" font-weight="600">severe training examples (log scale)</text>
    <text x="42" y="290" font-size="17" fill="#1d1d1b" text-anchor="middle" font-weight="600" transform="rotate(-90 42 290)">average precision, severe union</text>

    <!-- log-linear fit: measured, then extrapolated -->
    <line x1="130" y1="479" x2="583" y2="245" stroke="#0014a0" stroke-width="2.5"/>
    <line x1="583" y1="245" x2="900" y2="80"  stroke="#0014a0" stroke-width="2.5" stroke-dasharray="9 6" opacity="0.75"/>
    <text x="330" y="215" font-size="16" fill="#0014a0" font-weight="700">AP = −0.187 + 0.133 · ln(<tspan font-family="Georgia, Times New Roman, serif" font-style="italic">n</tspan>)</text>
    <text x="330" y="237" font-size="15" fill="#868686"><tspan font-family="Georgia, Times New Roman, serif" font-style="italic">R</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> = 0.979 · dashed = extrapolated</text>

    <!-- measured points, error bars = sd over 5 draws -->
    <g stroke="#eb0041" stroke-width="2">
      <line x1="174" y1="406" x2="174" y2="498"/><line x1="310" y1="376" x2="310" y2="426"/>
      <line x1="447" y1="261" x2="447" y2="339"/><line x1="583" y1="224" x2="583" y2="278"/>
    </g>
    <circle cx="174" cy="452" r="7" fill="#eb0041"/>
    <circle cx="310" cy="401" r="7" fill="#eb0041"/>
    <circle cx="447" cy="300" r="7" fill="#eb0041"/>
    <circle cx="583" cy="251" r="7" fill="#eb0041"/>

    <!-- observed range and planning extrapolation -->
    <line x1="583" y1="266" x2="583" y2="292" stroke="#eb0041" stroke-width="1.5"/>
    <text x="583" y="310" font-size="15" fill="#eb0041" font-weight="700" text-anchor="middle">largest observed training set</text>
    <rect x="640" y="372" width="270" height="112" rx="8" fill="#ffffff" stroke="#00965a" stroke-width="1.5"/>
    <text x="660" y="398" font-size="15" fill="#00965a" font-weight="700">planning extrapolation</text>
    <g font-size="15" fill="#4a4a4a">
      <text x="660" y="424">AP 0.70: about <tspan font-weight="700" fill="#00965a">800</tspan></text>
      <text x="660" y="448">AP 0.75: about <tspan font-weight="700" fill="#00965a">1,160</tspan></text>
      <text x="660" y="472">AP 0.80: about <tspan font-weight="700" fill="#00965a">1,690</tspan></text>
    </g>

    <rect x="955" y="180" width="195" height="210" rx="10" fill="#f4f6fd" stroke="#0014a0" stroke-width="1.5"/>
    <text x="975" y="210" font-size="17" fill="#0014a0" font-weight="700">Observed result</text>
    <text x="975" y="240" font-size="15" fill="#4a4a4a">Performance rises</text>
    <text x="975" y="260" font-size="15" fill="#4a4a4a">across the measured</text>
    <text x="975" y="280" font-size="15" fill="#4a4a4a">range. Each doubling</text>
    <text x="975" y="300" font-size="15" fill="#4a4a4a">adds about +0.09 AP.</text>
    <text x="975" y="334" font-size="15" fill="#0014a0" font-weight="700">Finding and reliably</text>
    <text x="975" y="354" font-size="15" fill="#0014a0" font-weight="700">labelling severe cases</text>
    <text x="975" y="374" font-size="15" fill="#0014a0" font-weight="700">is the bottleneck.</text>
  </g>
</svg>
