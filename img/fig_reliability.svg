<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620"
     role="img" aria-label="Reliability plot of out-of-fold probabilities for High and Unacceptable prompts. Each point represents one probability bin. The horizontal axis shows the mean predicted probability and the vertical axis shows the observed class frequency.">
  <g font-family="Source Sans Pro, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="118" cy="30" r="7" fill="#ff821e"/>
    <text x="132" y="36" font-size="17" fill="#1d1d1b" font-weight="600">HIGH</text>
    <circle cx="245" cy="30" r="7" fill="#eb0041"/>
    <text x="259" y="36" font-size="17" fill="#1d1d1b" font-weight="600">UNACCEPTABLE</text>

    <line x1="105" y1="545" x2="585" y2="545" stroke="#1d1d1b" stroke-width="2"/>
    <line x1="105" y1="545" x2="105" y2="65" stroke="#1d1d1b" stroke-width="2"/>
    <line x1="105" y1="545" x2="585" y2="65" stroke="#707070" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="595" y="72" font-size="15" fill="#707070">perfect calibration</text>

    <g font-size="15" fill="#4a4a4a" text-anchor="middle">
      <text x="105" y="571">0.0</text>
      <text x="201" y="571">0.2</text>
      <text x="297" y="571">0.4</text>
      <text x="393" y="571">0.6</text>
      <text x="489" y="571">0.8</text>
      <text x="585" y="571">1.0</text>
    </g>
    <g font-size="15" fill="#4a4a4a" text-anchor="end">
      <text x="93" y="551">0.0</text>
      <text x="93" y="455">0.2</text>
      <text x="93" y="359">0.4</text>
      <text x="93" y="263">0.6</text>
      <text x="93" y="167">0.8</text>
      <text x="93" y="71">1.0</text>
    </g>
    <text x="345" y="605" font-size="17" fill="#1d1d1b" text-anchor="middle" font-weight="600">mean predicted probability in bin</text>
    <text x="34" y="305" font-size="17" fill="#1d1d1b" text-anchor="middle" font-weight="600" transform="rotate(-90 34 305)">observed class frequency</text>

    <polyline points="107,543 179,321 238,200 255,118 514,116" fill="none" stroke="#ff821e" stroke-width="2.5" opacity="0.65"/>
    <circle cx="107" cy="543" r="11" fill="#ff821e"/>
    <circle cx="179" cy="321" r="6" fill="#ff821e"/>
    <circle cx="238" cy="200" r="8" fill="#ff821e"/>
    <circle cx="255" cy="118" r="6" fill="#ff821e"/>
    <circle cx="514" cy="116" r="5" fill="#ff821e"/>

    <polyline points="105,545 176,425 286,120 302,161" fill="none" stroke="#eb0041" stroke-width="2.5" opacity="0.65"/>
    <circle cx="105" cy="545" r="11" fill="#eb0041"/>
    <circle cx="176" cy="425" r="4" fill="#eb0041"/>
    <circle cx="286" cy="120" r="5" fill="#eb0041"/>
    <circle cx="302" cy="161" r="4" fill="#eb0041"/>
  </g>
</svg>
