<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730"
     role="img" aria-label="A pre-inference control layer assigns a severity score and applies a validated threshold plus rule indicators. Lower scores continue normally, higher scores trigger an automated policy response, and missing context leads the chatbot to ask a clarifying question. Requests are logged and a sample is reviewed offline.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0014a0"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff821e"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00b4e6"/></marker>
  </defs>

  <g font-family="Source Sans Pro, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="350" y="14" width="180" height="54" rx="27" fill="#eef0fb" stroke="#0014a0" stroke-width="2.5"/>
    <text x="440" y="48" text-anchor="middle" font-size="22" fill="#0014a0" font-weight="600">User prompt</text>
    <line x1="440" y1="68" x2="440" y2="98" stroke="#0014a0" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="20" y="100" width="840" height="260" rx="16" fill="#f4f6fd" stroke="#0014a0" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="40" y="132" font-size="16" fill="#0014a0" font-weight="700" letter-spacing="1.6">PRE-INFERENCE CONTROL LAYER</text>

    <rect x="40" y="150" width="248" height="88" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <text x="164" y="186" text-anchor="middle" font-size="22" fill="#1d1d1b" font-weight="600">Sentence embedding</text>
    <text x="164" y="214" text-anchor="middle" font-size="17" fill="#868686">frozen encoder</text>

    <rect x="316" y="150" width="248" height="88" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <text x="440" y="186" text-anchor="middle" font-size="22" fill="#1d1d1b" font-weight="600">SVM severity score</text>
    <text x="440" y="214" text-anchor="middle" font-size="17" fill="#868686">High or Unacceptable</text>

    <rect x="592" y="150" width="248" height="88" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <text x="716" y="186" text-anchor="middle" font-size="22" fill="#1d1d1b" font-weight="600">Validated threshold</text>
    <text x="716" y="214" text-anchor="middle" font-size="17" fill="#868686">chosen on held-out data</text>

    <line x1="288" y1="194" x2="314" y2="194" stroke="#0014a0" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="564" y1="194" x2="590" y2="194" stroke="#0014a0" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="716" y1="238" x2="716" y2="266" stroke="#0014a0" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="40" y="268" width="800" height="66" rx="10" fill="#ffffff" stroke="#ff821e" stroke-width="2.5"/>
    <text x="440" y="297" text-anchor="middle" font-size="21" fill="#1d1d1b" font-weight="600">Rule indicators for explicit regulated uses</text>
    <text x="440" y="321" text-anchor="middle" font-size="17" fill="#868686">may activate a stricter response policy</text>

    <line x1="440" y1="360" x2="440" y2="400" stroke="#0014a0" stroke-width="2.5"/>
    <line x1="140" y1="400" x2="740" y2="400" stroke="#0014a0" stroke-width="2.5"/>
    <line x1="140" y1="400" x2="140" y2="438" stroke="#00965a" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="440" y1="400" x2="440" y2="438" stroke="#ff821e" stroke-width="2.5" marker-end="url(#aro)"/>
    <line x1="740" y1="400" x2="740" y2="438" stroke="#00b4e6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arc)"/>

    <rect x="30" y="442" width="220" height="82" rx="10" fill="#ffffff" stroke="#00965a" stroke-width="2"/>
    <text x="140" y="476" text-anchor="middle" font-size="14" fill="#868686" letter-spacing="1.1">LOWER SCORE</text>
    <text x="140" y="506" text-anchor="middle" font-size="24" fill="#1d1d1b" font-weight="700">Continue</text>

    <rect x="330" y="442" width="220" height="82" rx="10" fill="#ffffff" stroke="#ff821e" stroke-width="2"/>
    <text x="440" y="476" text-anchor="middle" font-size="14" fill="#868686" letter-spacing="1.1">HIGHER SCORE</text>
    <text x="440" y="506" text-anchor="middle" font-size="24" fill="#1d1d1b" font-weight="700">Apply policy</text>

    <rect x="630" y="442" width="220" height="82" rx="10" fill="#ffffff" stroke="#00b4e6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="740" y="476" text-anchor="middle" font-size="14" fill="#868686" letter-spacing="1.1">MISSING CONTEXT</text>
    <text x="740" y="506" text-anchor="middle" font-size="24" fill="#1d1d1b" font-weight="700">Clarify</text>

    <line x1="140" y1="524" x2="140" y2="560" stroke="#00965a" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="440" y1="524" x2="440" y2="560" stroke="#ff821e" stroke-width="2.5" marker-end="url(#aro)"/>
    <line x1="740" y1="524" x2="740" y2="560" stroke="#00b4e6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arc)"/>

    <rect x="30" y="564" width="220" height="78" rx="10" fill="#eef8f3" stroke="#00965a" stroke-width="2"/>
    <text x="140" y="596" text-anchor="middle" font-size="21" fill="#007a49" font-weight="700">Standard response</text>
    <text x="140" y="620" text-anchor="middle" font-size="15" fill="#4e7662">enterprise LLM proceeds</text>

    <rect x="330" y="564" width="220" height="78" rx="10" fill="#fff4e9" stroke="#ff821e" stroke-width="2"/>
    <text x="440" y="591" text-anchor="middle" font-size="19" fill="#c75800" font-weight="700">Automated safe mode</text>
    <text x="440" y="614" text-anchor="middle" font-size="14" fill="#8c5b36">limit tools or refuse</text>
    <text x="440" y="631" text-anchor="middle" font-size="14" fill="#8c5b36">explicit prohibited use</text>

    <rect x="630" y="564" width="220" height="78" rx="10" fill="#e6f7fd" stroke="#00b4e6" stroke-width="2"/>
    <text x="740" y="594" text-anchor="middle" font-size="21" fill="#00779c" font-weight="700">Chatbot asks</text>
    <text x="740" y="619" text-anchor="middle" font-size="14" fill="#00779c">for purpose and context</text>

    <rect x="180" y="660" width="520" height="58" rx="10" fill="#f4f6fd" stroke="#0014a0" stroke-width="2"/>
    <text x="440" y="686" text-anchor="middle" font-size="19" fill="#0014a0" font-weight="700">Logged for monitoring</text>
    <text x="440" y="708" text-anchor="middle" font-size="15" fill="#4a58a8">selected cases enter an offline human audit</text>
  </g>
</svg>
