<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 630" width="1560" height="630"
     role="img" aria-label="A closed loop: at runtime a user prompt passes the control layer and receives an automated response policy. Logged requests are sampled for an offline audit. Human labels update the model, threshold and rules without placing a person in the live request path.">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0014a0"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b4e6"/>
    </marker>
  </defs>

  <g font-family="Source Sans Pro, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- ===== runtime band ===== -->
    <text x="160" y="76" font-size="18" fill="#0014a0" font-weight="700" letter-spacing="1.8">RUNTIME, EVERY REQUEST</text>
    <rect x="160" y="90" width="1240" height="180" rx="16" fill="#f4f6fd" stroke="#0014a0" stroke-width="2"/>

    <rect x="195" y="125" width="230" height="110" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <text x="310" y="190" text-anchor="middle" font-size="24" fill="#1d1d1b" font-weight="600">User prompt</text>

    <rect x="475" y="125" width="310" height="110" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2.5"/>
    <text x="630" y="172" text-anchor="middle" font-size="24" fill="#1d1d1b" font-weight="700">Control layer</text>
    <text x="630" y="202" text-anchor="middle" font-size="16" fill="#868686">embedding · SVM · thresholds · rules</text>

    <rect x="835" y="125" width="310" height="110" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <text x="990" y="172" text-anchor="middle" font-size="24" fill="#1d1d1b" font-weight="600">Response policy</text>
    <text x="990" y="202" text-anchor="middle" font-size="16" fill="#868686">continue · safe mode · clarify</text>

    <rect x="1195" y="125" width="170" height="110" rx="10" fill="#eef0fb" stroke="#0014a0" stroke-width="2"/>
    <text x="1280" y="170" text-anchor="middle" font-size="21" fill="#0014a0" font-weight="700">Enterprise</text>
    <text x="1280" y="196" text-anchor="middle" font-size="21" fill="#0014a0" font-weight="700">LLM</text>
    <text x="1280" y="220" text-anchor="middle" font-size="15" fill="#868686">standard or constrained</text>

    <line x1="425" y1="180" x2="472" y2="180" stroke="#0014a0" stroke-width="2.5" marker-end="url(#b)"/>
    <line x1="785" y1="180" x2="832" y2="180" stroke="#0014a0" stroke-width="2.5" marker-end="url(#b)"/>
    <line x1="1145" y1="180" x2="1192" y2="180" stroke="#0014a0" stroke-width="2.5" marker-end="url(#b)"/>

    <!-- ===== sample: runtime to data engine ===== -->
    <path d="M990 235 L990 350 L1240 350 L1240 432" fill="none" stroke="#00b4e6" stroke-width="3"
          stroke-dasharray="8 6" marker-end="url(#c)"/>
    <text x="1115" y="340" text-anchor="middle" font-size="17" fill="#00b4e6" font-weight="700">sampled · contested</text>

    <!-- ===== deploy: data engine -> runtime ===== -->
    <path d="M195 490 L118 490 L118 310 L630 310 L630 238" fill="none" stroke="#0014a0" stroke-width="3" marker-end="url(#b)"/>
    <text x="620" y="300" text-anchor="end" font-size="17" fill="#0014a0" font-weight="700">deploy model, threshold and rules</text>

    <!-- ===== data engine band ===== -->
    <text x="160" y="386" font-size="18" fill="#00779c" font-weight="700" letter-spacing="1.8">OFFLINE DATA ENGINE, SELECTED REQUESTS</text>
    <rect x="160" y="400" width="1240" height="180" rx="16" fill="#eefaff" stroke="#00b4e6" stroke-width="2"/>

    <rect x="1115" y="435" width="250" height="110" rx="10" fill="#ffffff" stroke="#00b4e6" stroke-width="2.5"/>
    <text x="1240" y="482" text-anchor="middle" font-size="23" fill="#1d1d1b" font-weight="700">Audit sample</text>
    <text x="1240" y="512" text-anchor="middle" font-size="16" fill="#868686">high scores and disagreements</text>

    <rect x="775" y="435" width="290" height="110" rx="10" fill="#ffffff" stroke="#00b4e6" stroke-width="2"/>
    <text x="920" y="482" text-anchor="middle" font-size="23" fill="#1d1d1b" font-weight="600">Human review</text>
    <text x="920" y="512" text-anchor="middle" font-size="16" fill="#868686">codebook · 2 passes · arbitration</text>

    <rect x="465" y="435" width="260" height="110" rx="10" fill="#ffffff" stroke="#00b4e6" stroke-width="2"/>
    <text x="595" y="482" text-anchor="middle" font-size="23" fill="#1d1d1b" font-weight="600">Labeled pool</text>
    <text x="595" y="512" text-anchor="middle" font-size="16" fill="#868686">consensus plus audited cases</text>

    <rect x="195" y="435" width="220" height="110" rx="10" fill="#ffffff" stroke="#00b4e6" stroke-width="2"/>
    <text x="305" y="482" text-anchor="middle" font-size="23" fill="#1d1d1b" font-weight="600">Train + calibrate</text>
    <text x="305" y="512" text-anchor="middle" font-size="16" fill="#868686">SVM · threshold · rules</text>

    <line x1="1115" y1="490" x2="1068" y2="490" stroke="#00b4e6" stroke-width="2.5" marker-end="url(#c)"/>
    <line x1="775"  y1="490" x2="728"  y2="490" stroke="#00b4e6" stroke-width="2.5" marker-end="url(#c)"/>
    <line x1="465"  y1="490" x2="418"  y2="490" stroke="#00b4e6" stroke-width="2.5" marker-end="url(#c)"/>
  </g>
</svg>
