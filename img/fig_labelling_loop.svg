<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 750" width="1800" height="750"
     role="img" aria-label="The labelling process: data preparation yields 6.72 million unique prompts, experts hand-label 826 observed prompts in round one, and the labelled retrieval pool grows to 9,127 prompts by round eleven. An iteration loop embeds prompts, retrieves neighbours, labels candidates with language models, reviews labels, refines the labelling prompt with AutoResearch, and fine-tunes the retriever. Synthetic retrieval aids are excluded from the final classifier corpus.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0014a0"/>
    </marker>
  </defs>
  <g font-family="Source Sans Pro, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- ===== one-off preparation ===== -->
    <rect x="40" y="50" width="820" height="150" rx="12" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <circle cx="74" cy="90" r="19" fill="#0014a0"/><text x="74" y="97" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">1</text>
    <text x="106" y="97" font-size="22" fill="#1d1d1b" font-weight="700">Data preparation</text>
    <rect x="68" y="129" width="7" height="7" fill="#0014a0"/><text x="86" y="136" font-size="16" fill="#4a4a4a">three public conversation corpora — user turns only</text>
    <rect x="68" y="155" width="7" height="7" fill="#0014a0"/><text x="86" y="162" font-size="16" fill="#4a4a4a">minimum length filter + exact deduplication</text>
    <rect x="68" y="181" width="7" height="7" fill="#0014a0"/><text x="86" y="188" font-size="16" fill="#0014a0" font-weight="700">6.72 M unique prompts</text>

    <rect x="940" y="50" width="820" height="150" rx="12" fill="#ffffff" stroke="#00b4e6" stroke-width="2.5"/>
    <circle cx="974" cy="90" r="19" fill="#00b4e6"/><text x="974" y="97" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">2</text>
    <text x="1006" y="97" font-size="22" fill="#1d1d1b" font-weight="700">Initial human seed labelling</text>
    <rect x="968" y="129" width="7" height="7" fill="#00b4e6"/><text x="986" y="136" font-size="16" fill="#4a4a4a">experts label a seed set by hand into the four AI-Act tiers</text>
    <rect x="968" y="155" width="7" height="7" fill="#00b4e6"/><text x="986" y="162" font-size="16" fill="#4a4a4a">documented codebook — intended purpose, not wording</text>
    <rect x="968" y="181" width="7" height="7" fill="#00b4e6"/><text x="986" y="188" font-size="16" fill="#0014a0" font-weight="700">Round 1: 826 observed prompts — 1 U · 21 H · 40 L · 764 M</text>

    <line x1="864" y1="125" x2="934" y2="125" stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M1350 200 L1350 222 L216 222 L216 288" fill="none" stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="790" y="215" text-anchor="end" font-size="16" fill="#868686">the labelled retrieval pool grows after every round</text>

    <!-- ===== iteration loop ===== -->
    <rect x="40" y="240" width="1720" height="375" rx="16" fill="#f4f6fd" stroke="#0014a0" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="66" y="277" font-size="17" fill="#0014a0" font-weight="700" letter-spacing="1.5">ITERATION LOOP — STEPS 3–7, REPEATED 11× · ROUND 11 POOL: 9,127 LABELLED SEEDS</text>
    <rect x="1290" y="264" width="14" height="14" rx="3" fill="#0014a0"/><text x="1312" y="277" font-size="16" fill="#868686">automated</text>
    <rect x="1470" y="264" width="14" height="14" rx="3" fill="#00b4e6"/><text x="1492" y="277" font-size="16" fill="#868686">human in the loop</text>

    <!-- 3 -->
    <rect x="61" y="292" width="310" height="210" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <circle cx="95" cy="332" r="19" fill="#0014a0"/><text x="95" y="339" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">3</text>
    <text x="127" y="339" font-size="21" fill="#1d1d1b" font-weight="700">Embed the prompts</text>
    <rect x="89" y="375" width="6" height="6" fill="#0014a0"/><text x="105" y="381" font-size="15" fill="#4a4a4a" font-family="Menlo, Consolas, monospace">nomic-ai/modernbert-</text>
    <text x="105" y="401" font-size="15" fill="#4a4a4a" font-family="Menlo, Consolas, monospace">embed-base</text>
    <rect x="89" y="423" width="6" height="6" fill="#0014a0"/><text x="105" y="429" font-size="15" fill="#4a4a4a">later rounds: the fine-tuned</text>
    <text x="105" y="449" font-size="15" fill="#4a4a4a">domain encoder</text>
    <rect x="89" y="471" width="6" height="6" fill="#0014a0"/><text x="105" y="477" font-size="15" fill="#4a4a4a">full-corpus vector cache</text>

    <!-- 4 -->
    <rect x="403" y="292" width="310" height="210" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <circle cx="437" cy="332" r="19" fill="#0014a0"/><text x="437" y="339" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">4</text>
    <text x="469" y="339" font-size="21" fill="#1d1d1b" font-weight="700">Retrieve neighbours</text>
    <rect x="431" y="375" width="6" height="6" fill="#0014a0"/><text x="447" y="381" font-size="15" fill="#4a4a4a">cosine top-K to prompts that</text>
    <text x="447" y="401" font-size="15" fill="#4a4a4a">are already labelled</text>
    <rect x="431" y="423" width="6" height="6" fill="#0014a0"/><text x="447" y="429" font-size="15" fill="#4a4a4a">aimed at the rare tiers</text>
    <text x="447" y="449" font-size="15" fill="#4a4a4a">(Unacceptable / High)</text>
    <rect x="431" y="471" width="6" height="6" fill="#0014a0"/><text x="447" y="477" font-size="15" fill="#4a4a4a">labelled rows excluded</text>

    <!-- 5 -->
    <rect x="745" y="292" width="310" height="210" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <circle cx="779" cy="332" r="19" fill="#0014a0"/><text x="779" y="339" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">5</text>
    <text x="811" y="339" font-size="21" fill="#1d1d1b" font-weight="700">LLM labelling</text>
    <rect x="773" y="375" width="6" height="6" fill="#0014a0"/><text x="789" y="381" font-size="15" fill="#4a4a4a">Mistral Medium 3.5 · Gemma 4 ·</text>
    <text x="789" y="401" font-size="15" fill="#4a4a4a">Qwen 3.5 — shared system prompt</text>
    <rect x="773" y="423" width="6" height="6" fill="#0014a0"/><text x="789" y="429" font-size="15" fill="#4a4a4a">blind to the retrieval target</text>
    <rect x="773" y="451" width="6" height="6" fill="#0014a0"/><text x="789" y="457" font-size="15" fill="#4a4a4a">runs on the newer corpora:</text>
    <text x="789" y="477" font-size="15" fill="#4a4a4a">Gemma + Qwen only</text>

    <!-- 6 -->
    <rect x="1087" y="292" width="310" height="210" rx="10" fill="#ffffff" stroke="#00b4e6" stroke-width="2.5"/>
    <circle cx="1121" cy="332" r="19" fill="#00b4e6"/><text x="1121" y="339" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">6</text>
    <text x="1153" y="339" font-size="21" fill="#1d1d1b" font-weight="700">Review labels</text>
    <rect x="1115" y="375" width="6" height="6" fill="#00b4e6"/><text x="1131" y="381" font-size="15" fill="#4a4a4a">review all High / Unacceptable</text>
    <rect x="1115" y="409" width="6" height="6" fill="#00b4e6"/><text x="1131" y="415" font-size="15" fill="#4a4a4a">sample Limited / Minimal</text>
    <rect x="1115" y="443" width="6" height="6" fill="#0014a0"/><text x="1131" y="449" font-size="15" fill="#4a4a4a">disagreements feed automated</text>
    <text x="1131" y="469" font-size="15" fill="#4a4a4a">prompt refinement</text>

    <!-- 7 -->
    <rect x="1429" y="292" width="310" height="210" rx="10" fill="#ffffff" stroke="#0014a0" stroke-width="2"/>
    <circle cx="1463" cy="332" r="19" fill="#0014a0"/><text x="1463" y="339" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">7</text>
    <text x="1495" y="339" font-size="21" fill="#1d1d1b" font-weight="700">Fine-tune the retriever</text>
    <rect x="1457" y="375" width="6" height="6" fill="#0014a0"/><text x="1473" y="381" font-size="15" fill="#4a4a4a">goal: more genuine U / H per</text>
    <text x="1473" y="401" font-size="15" fill="#4a4a4a">labelling call — not classify</text>
    <rect x="1457" y="423" width="6" height="6" fill="#0014a0"/><text x="1473" y="429" font-size="15" fill="#4a4a4a">trains on 13,252 rows —</text>
    <text x="1473" y="449" font-size="15" fill="#4a4a4a">2,586 real + 10,666 synthetic</text>
    <rect x="1457" y="471" width="6" height="6" fill="#0014a0"/><text x="1473" y="477" font-size="15" fill="#4a4a4a">released only if P@10 rises</text>

    <line x1="373" y1="397" x2="399" y2="397"   stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="715" y1="397" x2="741" y2="397"   stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="1057" y1="397" x2="1083" y2="397" stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="1399" y1="397" x2="1425" y2="397" stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>

    <path d="M1584 502 L1584 560 L216 560 L216 506" fill="none" stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="620" y="545" width="560" height="30" rx="6" fill="#f4f6fd"/>
    <text x="900" y="567" text-anchor="middle" font-size="16" fill="#0014a0" font-weight="600">fine-tuned retriever + AutoResearch-refined labelling prompt start the next round</text>

    <!-- ===== output ===== -->
    <line x1="900" y1="615" x2="900" y2="650" stroke="#0014a0" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="430" y="653" width="940" height="90" rx="12" fill="#eef0fb" stroke="#0014a0" stroke-width="2.5"/>
    <text x="900" y="690" text-anchor="middle" font-size="25" fill="#0014a0" font-weight="700">60,925 labelled prompts — Gemma + Qwen consensus</text>
    <text x="900" y="719" text-anchor="middle" font-size="17" fill="#4a4a4a">52 Unacceptable · 541 High · 1,027 Limited · 59,305 Minimal</text>
  </g>
</svg>
